<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1180" width="960" height="1180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Fondo general -->
  <rect width="960" height="1180" fill="#ffffff"/>

  <!-- Contenedor del Sistema -->
  <rect x="135" y="20" width="690" height="1060" rx="14" ry="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="480" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Sistema EcoDet (MVP)</text>

  <!-- ================= ACTORES ================= -->
  <!-- Visitante -->
  <g transform="translate(58, 95)" stroke="#334155" stroke-width="2" fill="none">
    <circle cx="0" cy="-22" r="11" fill="#ffffff"/>
    <line x1="0" y1="-11" x2="0" y2="18"/>
    <line x1="-16" y1="-2" x2="16" y2="-2"/>
    <line x1="0" y1="18" x2="-12" y2="38"/>
    <line x1="0" y1="18" x2="12" y2="38"/>
    <text x="0" y="56" text-anchor="middle" stroke="none" fill="#0f172a" font-size="13" font-weight="700">Visitante</text>
  </g>

  <!-- Usuario autenticado -->
  <g transform="translate(58, 595)" stroke="#334155" stroke-width="2" fill="none">
    <circle cx="0" cy="-22" r="11" fill="#ffffff"/>
    <line x1="0" y1="-11" x2="0" y2="18"/>
    <line x1="-16" y1="-2" x2="16" y2="-2"/>
    <line x1="0" y1="18" x2="-12" y2="38"/>
    <line x1="0" y1="18" x2="12" y2="38"/>
    <text x="0" y="56" text-anchor="middle" stroke="none" fill="#0f172a" font-size="13" font-weight="700">Usuario</text>
    <text x="0" y="72" text-anchor="middle" stroke="none" fill="#475569" font-size="11.5">autenticado</text>
  </g>

  <!-- Motor del sistema -->
  <g transform="translate(895, 485)" stroke="#334155" stroke-width="2" fill="none">
    <circle cx="0" cy="-22" r="11" fill="#ffffff"/>
    <line x1="0" y1="-11" x2="0" y2="18"/>
    <line x1="-16" y1="-2" x2="16" y2="-2"/>
    <line x1="0" y1="18" x2="-12" y2="38"/>
    <line x1="0" y1="18" x2="12" y2="38"/>
    <text x="0" y="56" text-anchor="middle" stroke="none" fill="#0f172a" font-size="13" font-weight="700">Motor del</text>
    <text x="0" y="72" text-anchor="middle" stroke="none" fill="#475569" font-size="11.5">sistema</text>
  </g>

  <!-- ================= CASOS DE USO: VISITANTE ================= -->
  <g>
    <ellipse cx="305" cy="92" rx="135" ry="27" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
    <text x="305" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">CU-01 Registrarse</text>
    <text x="305" y="105" text-anchor="middle" font-size="11" fill="#4338ca">HU-02</text>

    <ellipse cx="305" cy="160" rx="135" ry="27" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
    <text x="305" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">CU-02 Iniciar sesión</text>
    <text x="305" y="173" text-anchor="middle" font-size="11" fill="#4338ca">HU-03</text>
  </g>

  <!-- ================= CASOS DE USO: USUARIO Y SISTEMA ================= -->
  <g>
    <!-- CU-03 -->
    <ellipse cx="305" cy="236" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-03 Cerrar sesión</text>
    <text x="305" y="249" text-anchor="middle" font-size="11" fill="#047857">HU-04</text>

    <!-- CU-04 -->
    <ellipse cx="305" cy="304" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-04 Consultar mi perfil</text>
    <text x="305" y="317" text-anchor="middle" font-size="11" fill="#047857">HU-03 · DET-38</text>

    <!-- CU-05 -->
    <ellipse cx="305" cy="372" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-05 Gestionar inmuebles</text>
    <text x="305" y="385" text-anchor="middle" font-size="11" fill="#047857">Alta/edición/baja · HU-05 a 07</text>

    <!-- CU-06 -->
    <ellipse cx="305" cy="442" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-06 Cargar lectura</text>
    <text x="305" y="455" text-anchor="middle" font-size="11" fill="#047857">Individual · HU-08</text>

    <!-- CU-07 -->
    <ellipse cx="305" cy="512" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-07 Cargar facturas</text>
    <text x="305" y="525" text-anchor="middle" font-size="11" fill="#047857">En lote histórico · HU-09</text>

    <!-- CU-08 -->
    <ellipse cx="305" cy="582" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="578" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-08 Editar o eliminar lectura</text>
    <text x="305" y="595" text-anchor="middle" font-size="11" fill="#047857">Reevaluación · HU-11</text>

    <!-- CU-09 -->
    <ellipse cx="305" cy="652" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="648" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-09 Cargar datos de ejemplo</text>
    <text x="305" y="665" text-anchor="middle" font-size="11" fill="#047857">Inmueble demo · HU-19</text>

    <!-- CU-10 (Motor) -->
    <ellipse cx="660" cy="512" rx="140" ry="30" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
    <text x="660" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-10 Evaluar consumo</text>
    <text x="660" y="525" text-anchor="middle" font-size="11" fill="#047857">Detectar anomalías · HU-12, HU-13</text>

    <!-- CU-11 -->
    <ellipse cx="305" cy="735" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="731" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-11 Ver estado de aprendizaje</text>
    <text x="305" y="748" text-anchor="middle" font-size="11" fill="#047857">Progreso (&lt; 6 lecturas) · HU-14</text>

    <!-- CU-12 -->
    <ellipse cx="305" cy="825" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="821" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-12 Consultar historial</text>
    <text x="305" y="838" text-anchor="middle" font-size="11" fill="#047857">Franja habitual · HU-10, HU-21</text>

    <!-- CU-13 -->
    <ellipse cx="305" cy="915" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="911" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-13 Ver mis alertas y detalle</text>
    <text x="305" y="928" text-anchor="middle" font-size="11" fill="#047857">Filtros por servicio/estado · HU-15</text>

    <!-- CU-14 -->
    <ellipse cx="660" cy="875" rx="130" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="660" y="871" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-14 Marcar como normal</text>
    <text x="660" y="888" text-anchor="middle" font-size="11" fill="#047857">Exclusión estadística · HU-16</text>

    <!-- CU-15 -->
    <ellipse cx="660" cy="955" rx="130" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="660" y="951" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-15 Confirmar alerta</text>
    <text x="660" y="968" text-anchor="middle" font-size="11" fill="#047857">Revisión registrada · HU-17</text>

    <!-- CU-16 -->
    <ellipse cx="305" cy="1010" rx="135" ry="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
    <text x="305" y="1006" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">CU-16 Ajustar sensibilidad</text>
    <text x="305" y="1023" text-anchor="middle" font-size="11" fill="#047857">Umbrales por servicio · HU-18</text>
  </g>

  <!-- ================= ASOCIACIONES DIRECTAS ================= -->
  <g stroke="#475569" stroke-width="1.3">
    <!-- Visitante -->
    <line x1="75" y1="100" x2="170" y2="92"/>
    <line x1="75" y1="110" x2="170" y2="160"/>

    <!-- Usuario -->
    <line x1="75" y1="560" x2="172" y2="236"/>
    <line x1="75" y1="568" x2="172" y2="304"/>
    <line x1="75" y1="576" x2="172" y2="372"/>
    <line x1="75" y1="584" x2="170" y2="442"/>
    <line x1="75" y1="592" x2="170" y2="512"/>
    <line x1="75" y1="600" x2="170" y2="582"/>
    <line x1="75" y1="608" x2="170" y2="652"/>
    <line x1="75" y1="616" x2="170" y2="735"/>
    <line x1="75" y1="624" x2="170" y2="825"/>
    <line x1="75" y1="632" x2="170" y2="915"/>
    <line x1="75" y1="640" x2="172" y2="1010"/>

    <!-- Motor -->
    <line x1="880" y1="495" x2="800" y2="512"/>
  </g>

  <!-- ================= RELACIONES INCLUDE / EXTEND ================= -->
  <g stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-open)">
    <!-- Include a CU-10 -->
    <line x1="435" y1="448" x2="545" y2="494"/>
    <line x1="440" y1="512" x2="520" y2="512"/>
    <line x1="435" y1="576" x2="545" y2="530"/>
    <line x1="425" y1="640" x2="580" y2="538"/>

    <!-- Include CU-11 a CU-12 -->
    <line x1="305" y1="762" x2="305" y2="796"/>

    <!-- Extend CU-14, CU-15 a CU-13 -->
    <line x1="532" y1="882" x2="438" y2="906"/>
    <line x1="532" y1="948" x2="438" y2="924"/>
  </g>

  <!-- Etiquetas Include / Extend -->
  <g font-size="10.5" fill="#334155" text-anchor="middle">
    <rect x="466" y="454" width="56" height="16" rx="3" fill="#f8fafc"/>
    <text x="494" y="466">«include»</text>

    <rect x="454" y="502" width="56" height="16" rx="3" fill="#f8fafc"/>
    <text x="482" y="514">«include»</text>

    <rect x="466" y="546" width="56" height="16" rx="3" fill="#f8fafc"/>
    <text x="494" y="558">«include»</text>

    <rect x="485" y="582" width="56" height="16" rx="3" fill="#f8fafc"/>
    <text x="513" y="594">«include»</text>

    <rect x="276" y="771" width="58" height="16" rx="3" fill="#f8fafc"/>
    <text x="305" y="783">«include»</text>

    <rect x="460" y="882" width="54" height="16" rx="3" fill="#f8fafc"/>
    <text x="487" y="894">«extend»</text>

    <rect x="460" y="932" width="54" height="16" rx="3" fill="#f8fafc"/>
    <text x="487" y="944">«extend»</text>
  </g>

  <!-- ================= LEYENDA ================= -->
  <g transform="translate(150, 1102)" font-size="11.5" fill="#334155">
    <line x1="0" y1="8" x2="48" y2="8" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
    <text x="58" y="12"><tspan font-weight="700">«include»:</tspan> el caso de origen siempre ejecuta el caso destino</text>

    <line x1="0" y1="30" x2="48" y2="30" stroke="#475569" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
    <text x="58" y="34"><tspan font-weight="700">«extend»:</tspan> el caso de origen amplía opcionalmente el comportamiento del destino</text>

    <rect x="0" y="47" width="14" height="14" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="22" y="58">Casos del visitante</text>

    <rect x="165" y="47" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text x="187" y="58">Casos del usuario autenticado y del motor del sistema</text>
  </g>
</svg>
